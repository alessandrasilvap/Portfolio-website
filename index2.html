<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfólio</title>
    <style>
        * {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Open Sans;
            margin: 0;
        }
        .logo {
            background-color: #ffffff;
            color: #6a7189;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            text-align: center;
            font-size: 40px;
            font-weight: bold;
        }
        ul {
            list-style: none;
            background-color: #6a7189;
            text-align: right;
        }
        ul li {
            display: inline-block;
            position: relative;
        }
        ul li a {
            display: block;
            padding: 20px 25px;
            text-decoration: none;
            background-color: #6a7189;
        }
        ul li a:hover {
            background-color: #0f172a;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <p>A</p>
        </div>
		<ul>
			<li><a href="#">Início</a></li>
			<li><a href="#">Sobre</a></li>
			<li><a href="#">Projetos</a></li>
            <li><a href="#">Formação</a></li>
			<li><a href="#">Experiências</a></li>
            <li><a href="#">Contatos</a></li>
		</ul>
	</nav>
</body>
</html>
