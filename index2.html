<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfólio</title>
    <style>
        * {
            color: #ffffff;
            font-family: Open Sans;
            margin: 0;
        }
        body {
            background-color: #0f172a;
        }
        nav {
            display: flex;
            background-color: #6a7189;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
        }
        .logo {
            background-color: #ffffff;
            color: #6a7189;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        ul {
            list-style: none;
        }
        ul li {
            display: inline-block;
        }
        ul li a {
            display: block;
            padding: 20px 20px;
            text-decoration: none;
            transition: 0.3s;
            font-weight: 600;
        }
        ul li a:hover {
            background-color: #0f172a;
            color: #ffffff;
            border-radius: 10px;
            transform: scale(1.05);
        }

        header {
            display: flex;
            justify-content: center;
            gap: 80px;
            align-items: center;
            padding-top: 50px;
            padding-bottom: 50px;
        }
        img {
            width: 400px;;
            height: 400px;;
            border-radius: 50%;
            object-fit: cover;
            transition: 0.3s;
            background-color: #ffffff;
        }
        img:hover {
            transform: scale(1.05);
        }
        .inicio {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
            max-width: 700px;
        }
        h1 {
            font-size: 48px;
            line-height: 1.2;
        }
        h2 {
            font-size: 24px;
            color: #cbd5e1;
        }
        h3 {
            font-size: 18px;
            color: #94a3b8;
            font-weight: normal;
        }
        .navigationControle {
            display: flex;
            gap: 30px;
        }
        .navigation {
            padding: 0 25px;
            height: 50px;
            border-radius: 30px;
            background-color: #6a7189;
            color: #ffffff;
            border: none;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
        }
        .navigation:hover {
            cursor: pointer;
            background-color: #0f172a;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            A
        </div>
		<ul>
			<li><a href="#">Início</a></li>
			<li><a href="#">Sobre</a></li>
			<li><a href="#">Projetos</a></li>
            <li><a href="#">Formação</a></li>
			<li><a href="#">Experiências</a></li>
            <li><a href="#">Contatos</a></li>
		</ul>
	</nav>

    <header>
        <img src="/img.png" alt="Eu">

        <div class="inicio">
            <h1>Desenvolvedora focada em criar soluções reais com APIs, cloud e sistemas completos</h1>
            <h2>Alessandra Cristina da Silva Pereira</h2>
            <h3>21 anos • Rio de Janeiro - RJ</h3>

            <div class="navigationControle">
                <button class="navigation" type="button">Ver projetos</button> <button class="navigation"  type="button">Contato</button> <button class="navigation" type="button">Versão em Inglês</button>
            </div>
        </div>
	</header>

    <hr>

    <main>
        <section>
            <h1>Sobre</h1>
        </section>
    </main>
</body>
</html>
